# System Performance and Monitoring
monitoring:
  log_level: "INFO"               # Logging level: DEBUG, INFO, WARNING, ERROR
  performance_tracking: true      # Enable performance metrics tracking
  resource_monitoring: true       # Enable resource utilization monitoring
  thread_safety_logging: true     # Enable detailed thread safety logging
  
  # Alerts and notifications
  alerts:
    resource_contention_threshold: 80    # Percentage threshold for resource alerts
    patient_wait_time_threshold: 60      # Minutes before wait time alert
    system_error_threshold: 5           # Number of errors before alert
    low_doctor_availability_threshold: 20  # Percentage of available doctors before alert