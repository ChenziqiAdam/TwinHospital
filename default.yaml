# Twin Digital Hospital System Configuration with Continuous Export
# This file defines all system parameters and settings

patient_data:
  number_of_patients: 20
  patient_info:
    - id
    - name
    - age
    - gender
    - contact
    - insurance
    - status
    - arrival_time
    - discharge_time
    - priority
    - waiting_history
    - medical_record
    - symptoms
    - medical_history
    - consultation_history
  
  priority_levels:
    1: "Emergency"
    2: "Standard" 
  
  patient_status:
    - "New"
    - "Triage"
    - "Registration"
    - "Waiting"
    - "In Consultation"
    - "Undergoing Examination"
    - "Undergoing Lab Test"
    - "Collecting Medicine from Pharmacy"
    - "Discharged"
  
  medical_record:
    - "diagnoses"
    - "prescriptions"
    - "tests"
    - "consultations"

doctor_data:
  number_of_doctors: 12
  doctor_info:
    - name
    - gender
    - age
    - specialty
    - staff_id
    - years_experience
    - status
    - current_patient
    - patients_seen_today
    - max_patients_per_day
    - schedule
    - consultation_history
    - shift_start
    - shift_end
  
  specialties:
    - "General"
    - "Cardiologist"
    - "Dermatologist"
    - "Neurologist"
    - "Pediatrician"
  
  doctor_status:
    - "Available"
    - "In Consultation"
    - "Reviewing Records"
    - "On Break"
    - "Off Duty"

hospital_data:
  hospital_info:
    - id
    - name
    - doctors
    - patients
    - active_patients
    - rooms
    - departments
    - resource_logs
    - patient_logs
    - revenue
    - expenses
    - billing_records
  
  operation_hours:
    start: 0
    end: 23
    duration: 23

  timeout: 360
  
  # Room configuration: room_type: total_count
  rooms:
    consultation: 8
    waiting: 8
    triage: 2
    registration: 2
    lab: 2
    examination: 3
    pharmacy: 2
    emergency: 2
  
  # Doctors per department (used for capacity planning)
  doctor_per_department:
    General: 8
    Cardiologist: 1
    Dermatologist: 1
    Neurologist: 1
    Pediatrician: 1
  
  # Medical devices available in the hospital
  devices:
    - "ECG Machine"
    - "X-Ray Machine"
    - "MRI Machine"
    - "CT Machine"
    - "Ultrasound Machine"
    - "Blood Analyze Machine"
    - "Urinalysis Machine"

  # Medical tests available (Align with devices)
  tests:
    Examination:
      - "Blood Analyze"
      - "Urinalysis"
    Lab_Test:
      - "ECG"
      - "X-Ray"
      - "MRI"
      - "CT"
      - "Ultrasound"

# Continuous Export Configuration
continuous_export:
  enabled: true                    # Enable/disable continuous export
  export_interval: 5              # Seconds between automatic exports (0 to disable scheduled exports)
  export_on_events: true           # Export immediately on key events (patient admission, discharge, etc.)
  export_directory: "exports"      # Directory to save export files
  file_name_pattern: "hospital_simulation_{timestamp}.json"  # File naming pattern

# Enhanced LLM Configuration
llm:
  model_name: deepseek-ai/DeepSeek-V3
  api_key: sk-fxanyzqjnqjwevqrcqclpdekwfslpkyljjrvvelnmipgdotl
  base_url: https://api.siliconflow.cn/v1
  provider: openai
  max_tokens: 7800
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 4

# Export Monitoring
monitoring:
  enabled: true                    # Enable/disable real-time export monitoring
  duration_seconds: 360             # Duration to monitor export file changes