    General: 8
    Cardiologist: 1
    Dermatologist: 1
    Neurologist: 1
    Pediatrician: 1
  
  # Medical devices available in the hospital
  devices:
    - "ECG Machine"
    - "X-Ray Machine"
    - "MRI Machine"
    - "CT Machine"
    - "Ultrasound Machine"
    - "Blood Analyze Machine"
    - "Urinalysis Machine"

  # Medical tests available (Align with devices)
  tests:
    Examination:
      - "Blood Analyze"
      - "Urinalysis"
    Lab_Test:
      - "ECG"
      - "X-Ray"
      - "MRI"
      - "CT"
      - "Ultrasound"

# NEW: Continuous Export Configuration
continuous_export:
  enabled: true                    # Enable/disable continuous export
  export_interval: 5              # Seconds between automatic exports (0 to disable scheduled exports)
  export_on_events: true           # Export immediately on key events (patient admission, discharge, etc.)
  export_directory: "exports"      # Directory to save export files
  file_name_pattern: "continuous_hospital_simulation_{timestamp}.json"  # File naming pattern
  max_history_entries: 1000         # Maximum number of historical entries to keep in export
  
  # Events that trigger immediate export (when export_on_events is true)
  trigger_events:
    - "patient_admission"
    - "patient_discharge"  
    - "billing_event"
    - "payment_processed"
    - "consultation_complete"
    - "test_complete"
  
  # Data sections to include in continuous export
  export_sections:
    patients_processed: true       # Include all processed patients
    active_patients: true          # Include currently active patients
    hospital_statistics: true     # Include hospital statistics
    resource_logs: true           # Include resource utilization logs
    patient_logs: true            # Include patient event logs
    billing_records: true         # Include billing information
    doctor_statuses: true         # Include real-time doctor statuses
    room_utilization: true        # Include room utilization data
    daily_statistics: true        # Include daily operational statistics

