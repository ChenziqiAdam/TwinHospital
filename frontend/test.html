<!DOCTYPE html>

    <title>Hospital Simulation Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .card {
            background-color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease-in-out;
        }
        .accordion-header {
            cursor: pointer;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .accordion-open .accordion-content {
            max-height: 2000px; /* Adjust as needed */
        }
        .rotate-180 {
            transform: rotate(180deg);
        }
        .transition-transform {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('report-container');
            const meta = jsonData.simulation_metadata;
            const stats = jsonData.hospital_statistics;

            // --- HEADER ---
            const headerHTML = `
                <div class="card p-6">
                    <h1 class="text-3xl font-bold text-gray-800">${meta.hospital_name}</h1>
                    <p class="text-lg text-gray-600">Simulation Analysis Report</p>
                    <div class="mt-4 border-t pt-4 flex flex-wrap gap-x-8 gap-y-2 text-sm text-gray-500">
                        <span><strong>Report Generated:</strong> ${new Date(meta.export_time).toLocaleString()}</span>
                        <span><strong>Total Patients:</strong> ${meta.total_patients}</span>
                        <span><strong>Total Doctors:</strong> ${meta.total_doctors}</span>
                        <span><strong>Simulation Duration:</strong> ${(meta.simulation_duration_hours * 60).toFixed(2)} minutes</span>
                    </div>
                </div>
            `;
            container.innerHTML += headerHTML;

            // --- HOSPITAL STATISTICS ---

                <div class="card p-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Hospital Statistics</h2>

                            <p class="text-sm text-blue-700">Total Patients Processed</p>
                            <div class="mt-2 text-sm space-y-1 text-blue-600">

                            <p class="text-sm text-green-700">Total Profit</p>

                            </div>
                        </div>

                            <h3 class="font-semibold text-indigo-800">Operational Metrics</h3>
                            <p class="text-3xl font-bold text-indigo-900">${stats.operational_metrics.avg_patient_processing_time}</p>
                            <p class="text-sm text-indigo-700">Avg. Processing Time</p>
                             <div class="mt-2 text-sm space-y-1 text-indigo-600">
                                <p>Patient Satisfaction: ${stats.operational_metrics.patient_satisfaction_score}</p>
                                <p>Bed Occupancy: ${stats.operational_metrics.bed_occupancy_rate}</p>
                            </div>
                        </div>
                        <!-- General Info -->
                        <div class="bg-gray-50 p-4 rounded-lg">
                            <h3 class="font-semibold text-gray-800">General Info</h3>
                            <p class="text-3xl font-bold text-gray-900">${stats.hospital_info.departments}</p>
                            <p class="text-sm text-gray-700">Departments</p>
                             <div class="mt-2 text-sm space-y-1 text-gray-600">
                                <p>Doctors on Staff: ${stats.hospital_info.total_doctors}</p>
                                <p>Operation Hours: ${stats.hospital_info.operation_hours.toFixed(2)}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += statsHTML;
            
            // --- RESOURCE UTILIZATION ---
            let roomsHTML = '<div class="card p-6"><h2 class="text-2xl font-bold text-gray-800 mb-4">Resource Utilization</h2><h3 class="text-lg font-semibold text-gray-700 mb-3">Rooms</h3><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">';
            for (const room in stats.resource_utilization.rooms) {
                const r = stats.resource_utilization.rooms[room];
                roomsHTML += `
                    <div class="border p-3 rounded-lg text-center">
                        <p class="font-semibold capitalize">${room}</p>
                        <p class="text-2xl font-bold">${r.utilization_rate}</p>
                        <p class="text-xs text-gray-500">${r.occupied} / ${r.total} Occupied</p>
                    </div>
                `;
            }
            roomsHTML += '</div>';

            let doctorsTableHTML = '<h3 class="text-lg font-semibold text-gray-700 mt-6 mb-3">Doctors</h3><div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-200"><thead><tr><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Specialty</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patients Seen</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Utilization</th><th class="px-6 py-3 bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th></tr></thead><tbody class="bg-white divide-y divide-gray-200">';
            stats.resource_utilization.doctors.forEach(doc => {
                doctorsTableHTML += `<tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${doc.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${doc.specialty}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${doc.patients_seen}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${doc.utilization}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${doc.status === 'Available' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">${doc.status}</span></td>
                </tr>`;
            });
            doctorsTableHTML += '</tbody></table></div></div>';
            container.innerHTML += roomsHTML + doctorsTableHTML;

            // --- PATIENT SUMMARIES ---
            let patientsHTML = '<div class="card p-6"><h2 class="text-2xl font-bold text-gray-800 mb-4">Patient Summaries</h2><div class="space-y-2">';
            jsonData.patient_summaries.forEach(p => {
                patientsHTML += `
                    <div class="border rounded-lg accordion-item">
                        <div class="accordion-header p-4 flex justify-between items-center bg-gray-50 rounded-t-lg">
                            <div>
                                <p class="font-semibold text-gray-800">${p.patient_info.name} <span class="text-sm font-normal text-gray-500">(ID: ${p.patient_info.id})</span></p>
                                <p class="text-sm text-gray-600">${p.medical_record.diagnoses[0]?.diagnosis || 'N/A'}</p>
                            </div>
                            <svg class="w-6 h-6 text-gray-500 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="accordion-content">
                            <div class="p-4 border-t grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                                <div><strong>Age:</strong> ${p.patient_info.age}</div>
                                <div><strong>Gender:</strong> ${p.patient_info.gender}</div>
                                <div><strong>Priority:</strong> ${p.visit_info.priority}</div>
                                <div><strong>Arrival:</strong> ${new Date(p.visit_info.arrival_time).toLocaleTimeString()}</div>
                                <div><strong>Discharge:</strong> ${new Date(p.visit_info.discharge_time).toLocaleTimeString()}</div>
                                <div><strong>Waiting Time:</strong> ${p.waiting_time_seconds}s</div>
                                <div class="md:col-span-3"><strong>Diagnosis:</strong> ${p.medical_record.diagnoses.map(d => `${d.diagnosis} (by Dr. ${d.doctor})`).join(', ')}</div>
                                <div class="md:col-span-3"><strong>Tests:</strong> ${p.medical_record.tests.join(', ') || 'None'}</div>
                                <div class="md:col-span-3"><strong>Prescriptions:</strong> ${p.medical_record.prescriptions.join(', ') || 'None'}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            patientsHTML += '</div></div>';
            container.innerHTML += patientsHTML;

            // --- DOCTOR SUMMARIES ---
            let doctorsHTML = '<div class="card p-6"><h2 class="text-2xl font-bold text-gray-800 mb-4">Doctor Summaries</h2><div class="space-y-2">';
            jsonData.doctor_summaries.forEach(d => {
                doctorsHTML += `
                     <div class="border rounded-lg accordion-item">
                        <div class="accordion-header p-4 flex justify-between items-center bg-gray-50 rounded-t-lg">
                            <div>
                                <p class="font-semibold text-gray-800">Dr. ${d.doctor_info.name} <span class="text-sm font-normal text-gray-500">(${d.doctor_info.specialty})</span></p>
                                <p class="text-sm text-gray-600">Patients Seen: ${d.daily_metrics.patients_seen} | Utilization: ${d.daily_metrics.utilization_rate}%</p>
                            </div>
                            <svg class="w-6 h-6 text-gray-500 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                        <div class="accordion-content">
                            <div class="p-4 border-t grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                                <div><strong>Staff ID:</strong> ${d.doctor_info.staff_id}</div>
                                <div><strong>Experience:</strong> ${d.doctor_info.experience_years} years</div>
                                <div><strong>Status:</strong> ${d.current_status.status}</div>
                                <div><strong>Shift:</strong> ${d.current_status.shift_start} - ${d.current_status.shift_end}</div>
                                <div><strong>Avg. Consultation:</strong> ${d.daily_metrics.average_consultation_time_minutes.toFixed(1)} min</div>
                            </div>
                        </div>
                    </div>
                `;
            });
            doctorsHTML += '</div></div>';
            container.innerHTML += doctorsHTML;


            // Accordion functionality
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const accordionItem = header.parentElement;
                    accordionItem.classList.toggle('accordion-open');
                    const icon = header.querySelector('svg');
                    icon.classList.toggle('rotate-180');
                });
            });
        });
    </script>

</body>
</html>
