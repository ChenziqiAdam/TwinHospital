<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hospital Lobby</title>
<style>
  html,body{height:100%;margin:0;background:#1b1b1b;display:grid;place-items:center}
  canvas{image-rendering: pixelated; image-rendering: crisp-edges; background:#000; box-shadow:0 8px 30px rgba(0,0,0,.5); border:2px solid #2b2b2b}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#cfd8dc;font:14px/1.4 system-ui,Segoe UI,Arial}
  .hint kbd{background:#263238;color:#fff;padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid #0003}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111b;backdrop-filter:blur(6px);
         color:#fff;padding:8px 12px;border-radius:8px;font:13px/1 system-ui,Segoe UI,Arial;display:none; z-index: 20}
  .btn{
    position:fixed; top:14px; right:14px; z-index:10;
    background:#1f2937; color:#e5e7eb; border:1px solid #ffffff22; padding:6px 10px; border-radius:8px;
    font:13px system-ui; cursor:pointer; user-select:none; margin-left:8px;
  }
  .btn:hover{ background:#26323f }
  #debugBtn{ right:14px }
  #coordBtn{ right:170px }
  .coord-panel{
    position:fixed; left:14px; top:14px; z-index:10; min-width:220px;
    background:#0b1020d0; color:#e6f1ff; border:1px solid #ffffff22; border-radius:8px;
    padding:8px 10px; font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    backdrop-filter: blur(6px); display:none;
  }
  .coord-panel .tag{color:#9be7ff}
  .coord-panel .small{opacity:.8; font-size:11px}

  /* === 对话面板 === */
  .dialogue-mask{
    position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.45); z-index:50;
  }
  .dialogue{
    width:min(560px, 92vw); max-height:80vh; overflow:auto;
    background:#0b1020; border:1px solid #2b3b55; border-radius:12px; padding:14px 16px;
    box-shadow:0 12px 40px rgba(0,0,0,.6); color:#e6f1ff; font:14px/1.6 system-ui,Segoe UI,Arial;
  }
  .dialogue h3{ margin:0 0 8px; font:600 16px system-ui }
  .dialogue .npc{ opacity:.92; color:#a3d3ff; margin-bottom:8px }
  .dialogue .choices{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px }
  .dialogue .choices button{
    background:#14213a; color:#e5e7eb; border:1px solid #2b3b55; border-radius:10px; padding:8px 10px;
    font:13px system-ui; cursor:pointer;
  }
  .dialogue .choices button:hover{ background:#172b4d }
  .dialogue .row{ display:flex; justify-content:space-between; align-items:center; gap:8px }
  .dialogue .close{
    background:#1f2937; color:#e5e7eb; border:1px solid #ffffff22; padding:6px 10px; border-radius:8px;
    font:12px system-ui; cursor:pointer;
  }
</style>
</head>
<body data-room="lobby">
<canvas id="game" width="1152" height="768"></canvas>

<!-- 顶部按钮/提示 -->
<button class="btn" id="coordBtn">📐 Coords (G)</button>
<button class="btn" id="debugBtn">👀 Show Colliders (O)</button>
<div class="coord-panel" id="coordPanel"></div>
<div class="toast" id="toast">按 <kbd>E</kbd> 进入</div>
<div class="hint">移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键　进入房间：靠近门后按 <kbd>E</kbd>　对话：靠近前台按 <kbd>E</kbd>　·　碰撞：<kbd>O</kbd>　·　坐标：<kbd>G</kbd>　·　病历：<kbd>R</kbd></div>

<!-- === 对话 Overlay（保持原状） === -->
<div class="dialogue-mask" id="dlgMask" role="dialog" aria-modal="true">
  <div class="dialogue" id="dlgBox">
    <div class="row">
      <h3 id="dlgTitle">前台</h3>
      <button class="close" id="dlgClose">关闭</button>
    </div>
    <div class="npc" id="dlgText">您好，请问需要什么帮助？</div>
    <div class="choices" id="dlgChoices"></div>
  </div>
</div>

<!-- 先加载核心脚本 -->
<script src="twin-core.js"></script>
<script>
/* ========= 房间专属配置（仅数据与对话逻辑） ========= */

/* 背景与主角帧 */
const ASSETS = {
  bg: "lobby.png",
  right: ["ACgarRight1.png","ACgarRight2.png","ACgarRight3.png","ACgarRight4.png"],
  left:  ["ACharLeft2.png","ACharLeft3.png","ACharLeft4.png"],
  down:  ["ACharDown1.png","ACharDown2.png"],
  up:    ["ACharUp1.png","ACharUp2.png","ACharUp3.png"]
};
/* 路由：进门跳转 */
const ROUTES = {
  consult: "consultation.html",
  exam:    "examination.html",
  lab:     "lab.html",
  pharm:   "pharmacy.html"
};

/* 以 1152x768 为基准坐标 */
const BASE_W = 1152, BASE_H = 768;

/* 门与障碍（房间专属） */
const doorBoxesBase = [
  {name:'consult', x:144, y:112, w:120, h:124},
  {name:'exam',    x:438, y:112, w:92,  h:124},
  {name:'lab',     x:691, y:112, w:80,  h:124},
  {name:'pharm',   x:923, y:112, w:100, h:124},
];

const obstacleBase = [
  {x: 79,  y: 361, w: 220, h: 90},   // Registration desk
  {x: 771, y: 363, w: 220, h: 90},   // Triage desk
  {x: 380, y: 430, w: 305, h: 36},   // benches row1
  {x: 380, y: 510, w: 305, h: 36},   // benches row2
  {x: 0,   y: 0,   w: 1151, h: 193}, // wall
  {x: 448, y: 574, w: 185, h: 139},  // benches row3
];

/* 前台对话热点（玩家站位区） */
const talkBoxesBase = [
  {name:'registration', x:85,  y:462, w:210, h:44, label:'Registration'},
  {name:'triage',       x:777, y:462, w:210, h:44, label:'Triage'}
];

/* === 对话系统（和原来一致） === */
const dlgMask = document.getElementById('dlgMask');
const dlgClose = document.getElementById('dlgClose');
const dlgTitle = document.getElementById('dlgTitle');
const dlgText  = document.getElementById('dlgText');
const dlgChoices = document.getElementById('dlgChoices');

const Dialogue = {
  active: false,
  context: null,
  open(kind){
    this.active = true;
    this.context = { kind };
    dlgMask.style.display = 'grid';
    if (kind==='registration'){
      dlgTitle.textContent = 'Registration 前台';
      dlgText.textContent = '您好，请问需要办理什么业务？';
      renderChoices([
        {label:'挂号登记', value:'register'},
        {label:'咨询就诊流程', value:'ask_flow'},
        {label:'没事了', value:'cancel'}
      ], (val)=>this.choose(val));
    } else if (kind==='triage'){
      dlgTitle.textContent = 'Triage 分诊台';
      dlgText.textContent = '您好，请简单描述一下您的症状，我来为您分诊。';
      renderChoices([
        {label:'描述症状并请求分诊', value:'describe'},
        {label:'我再等等', value:'cancel'}
      ], (val)=>this.choose(val));
    }
  },
  choose(val){
    // 建议：以后统一改为 TwinCore.sceneEvent(...)
    TwinCore.sceneEvent({
      type: 'interaction',
      room: 'lobby',
      target: this.context?.kind,
      action: 'dialogue_choice',
      choice: val,
    });

    if (this.context?.kind==='registration'){
      if (val==='register'){
        dlgText.textContent = '好的，我已为您创建就诊档案，请等候叫号后前往 Consultation。';
        renderChoices([{label:'好的', value:'ok'}], ()=>this.close());
      } else if (val==='ask_flow'){
        dlgText.textContent = '一般流程：分诊 → 挂号 → 问诊 → 检查/化验 → 取药/离院。需要我为您分诊吗？';
        renderChoices([
          {label:'去分诊', value:'goto_triage'},
          {label:'暂时不用', value:'cancel'}
        ], (v)=>{
          if (v==='goto_triage'){ this.close(); this.open('triage'); }
          else this.close();
        });
      } else { this.close(); }
    } else if (this.context?.kind==='triage'){
      if (val==='describe'){
        dlgText.textContent = '已为您完成分诊，建议先去 Registration 挂号。';
        renderChoices([{label:'收到', value:'ok'}], ()=>this.close());
      } else { this.close(); }
    }
  },
  close(){
    this.active = false;
    this.context = null;
    dlgMask.style.display = 'none';
  }
};
dlgClose.onclick = ()=>Dialogue.close();

function renderChoices(items, onChoose){
  dlgChoices.innerHTML = '';
  items.forEach(({label, value})=>{
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = ()=>onChoose(value);
    dlgChoices.appendChild(btn);
  });
}

/* ========= 初始化 TwinCore：把页面专属数据交给它 ========= */
TwinCore.init({
  canvas: document.getElementById('game'),
  room: document.body.dataset.room || 'lobby',

  // 资源与主角初始值
  assets: ASSETS,
  player: { x: 1152*0.55, y: 768*0.78, w: 74, h: 74, speed: 2.2, frameDelay: 100 },

  // 基准坐标系与场景数据
  baseSize: { w: BASE_W, h: BASE_H },
  doors: doorBoxesBase,
  obstacles: obstacleBase,
  talks: talkBoxesBase,

  // UI 绑定（TwinCore 内部会接管按钮/提示/面板与键位 O/G/R）
  ui: {
    toast: document.getElementById('toast'),
    coordBtn: document.getElementById('coordBtn'),
    debugBtn: document.getElementById('debugBtn'),
    coordPanel: document.getElementById('coordPanel')
  },

  // 当 UI（对话框）占用时，应暂停移动/交互
  getUiLocked: ()=> Dialogue.active,

  // 按 E 键时由 TwinCore 判定靠近什么，并回调此函数
  onInteract: ({ nearTalk, nearDoor })=>{
    if (nearTalk) {
      Dialogue.open(nearTalk);
      return;
    }
    if (nearDoor) {
      const url = ROUTES[nearDoor];
      if (url) location.href = url;
    }
  },

  // 可选：把事件也发给后端；TwinCore 会先写入“病历”，再尝试 POST
  sceneEventEndpoint: '/api/scene-event',
});
</script>
</body>
</html>
