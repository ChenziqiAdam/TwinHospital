<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Consultation Room</title>
<style>
  html,body{height:100%;margin:0;background:#111;display:grid;place-items:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid #2b2b2b;box-shadow:0 8px 30px rgba(0,0,0,.5);background:#000}
  .btn{position:fixed;top:14px;right:14px;z-index:10;background:#1f2937;color:#e5e7eb;border:1px solid #ffffff22;padding:6px 10px;border-radius:8px;font:13px system-ui;cursor:pointer;margin-left:8px}
  #coordBtn{right:170px}
  .btn:hover{background:#26323f}
  .coord-panel{position:fixed;left:14px;top:14px;z-index:10;min-width:220px;background:#0b1020d0;color:#e6f1ff;border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;backdrop-filter:blur(6px);display:none}
  .coord-panel .tag{color:#9be7ff}
  .coord-panel .small{opacity:.8;font-size:11px}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111b;color:#fff;padding:6px 10px;border-radius:8px;display:none; z-index:20}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#cfd8dc;font:14px system-ui}
  .hint kbd{background:#263238;color:#fff;padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid #0003}

  /* === 对话面板（保留原结构） === */
  .dialogue-mask{
    position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.45); z-index:50;
  }
  .dialogue{
    width:min(560px,92vw); max-height:80vh; overflow:auto;
    background:#0b1020; border:1px solid #2b3b55; border-radius:12px; padding:14px 16px;
    box-shadow:0 12px 40px rgba(0,0,0,.6); color:#e6f1ff; font:14px/1.6 system-ui,Segoe UI,Arial;
  }
  .dialogue h3{ margin:0 0 8px; font:600 16px system-ui }
  .dialogue .npc{ opacity:.92; color:#a3d3ff; margin-bottom:8px }
  .dialogue .choices{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px }
  .dialogue .choices button{
    background:#14213a; color:#e5e7eb; border:1px solid #2b3b55; border-radius:10px; padding:8px 10px;
    font:13px system-ui; cursor:pointer;
  }
  .dialogue .choices button:hover{ background:#172b4d }
  .dialogue .row{ display:flex; justify-content:space-between; align-items:center; gap:8px }
  .dialogue .close{
    background:#1f2937; color:#e5e7eb; border:1px solid #ffffff22; padding:6px 10px; border-radius:8px;
    font:12px system-ui; cursor:pointer;
  }
</style>
</head>
<body data-room="consultation">
<canvas id="game" width="1152" height="768"></canvas>

<!-- 顶部按钮/提示 -->
<button class="btn" id="coordBtn">📐 Coords (G)</button>
<button class="btn" id="debugBtn">👀 Show Colliders (O)</button>
<div class="coord-panel" id="coordPanel"></div>
<div class="toast" id="toast">按 <kbd>E</kbd> 返回大厅</div>
<div class="hint">移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键　对话：走到桌前按 <kbd>E</kbd>　返回大厅：走到门口按 <kbd>E</kbd>　·　碰撞：<kbd>O</kbd>　·　坐标：<kbd>G</kbd>　·　病历：<kbd>R</kbd></div>

<!-- === 对话 Overlay === -->
<div class="dialogue-mask" id="dlgMask" role="dialog" aria-modal="true">
  <div class="dialogue" id="dlgBox">
    <div class="row">
      <h3 id="dlgTitle">医生</h3>
      <button class="close" id="dlgClose">关闭</button>
    </div>
    <div class="npc" id="dlgText">你好，我是值班医生，请描述你的不适或出示分诊信息。</div>
    <div class="choices" id="dlgChoices"></div>
  </div>
</div>

<!-- 统一核心脚本 -->
<script src="twin-core.js"></script>
<script>
/* ========= 房间专属配置（数据 + 对话逻辑） ========= */

/* 资源与主角帧 */
const ASSETS = {
  bg: "consultation.png",
  right:["ACgarRight1.png","ACgarRight2.png","ACgarRight3.png","ACgarRight4.png"],
  left:["ACharLeft2.png","ACharLeft3.png","ACharLeft4.png"],
  down:["ACharDown1.png","ACharDown2.png"],
  up:["ACharUp1.png","ACharUp2.png","ACharUp3.png"]
};

/* 返回大厅的路由 */
const RETURN_URL = "lobby.html";

/* 基准坐标系 */
const BASE_W = 1152, BASE_H = 768;

/* 出口（回到 lobby） */
const doorBoxesBase = [
  { name:"exit", x:491, y:548, w:100, h:250 }
];

/* 场景障碍（桌子/墙/设备） */
const obstacleBase = [
  {x:0,   y:226, w:1151, h:70},   // 上方墙体
  {x:429, y:288, w:240,  h:40},   // 中央医生桌
  {x:446, y:566, w:230,  h:180},  // 下方桌/柜
  {x:828, y:297, w:120,  h:70},   // 右侧设备/柜
];

/* 医生对话站位带（玩家站在此矩形内可按E触发对话） */
const talkBoxesBase = [
  { name:'doctor', x:440, y:338, w:220, h:46, label:'Doctor Talk Area' }
];

/* === 对话系统（仅处理医疗逻辑与事件上报） === */
const dlgMask = document.getElementById('dlgMask');
const dlgClose = document.getElementById('dlgClose');
const dlgTitle = document.getElementById('dlgTitle');
const dlgText  = document.getElementById('dlgText');
const dlgChoices = document.getElementById('dlgChoices');

const Dialogue = {
  active: false,
  context: null, // {kind:'doctor'}
  open(kind='doctor'){
    this.active = true;
    this.context = { kind };
    dlgMask.style.display = 'grid';
    dlgTitle.textContent = '医生';
    dlgText.textContent  = '你好，请说说你的不适或近期检查结果。';
    renderChoices([
      {label:'描述症状并开始问诊', value:'start_consult'},
      {label:'出示分诊建议',       value:'show_triage'},
      {label:'暂时没事',           value:'cancel'}
    ], (val)=>this.choose(val));
  },
  choose(val){
    // 统一走 TwinCore.sceneEvent：本地写入病历 + （可选）POST 后端
    TwinCore.sceneEvent({
      type:'interaction',
      room:'consultation',
      target:'doctor',
      action:'dialogue_choice',
      choice:val
    });

    if (val==='start_consult'){
      dlgText.textContent = '我已记录你的症状。建议进行一次基础体格检查和血常规化验。';
      renderChoices([
        {label:'接受并获取检查单', value:'accept_orders'},
        {label:'再想想',           value:'cancel'}
      ], (v)=>{
        if (v==='accept_orders'){
          // 医生开具检查单（体格检查 + 血常规）
          TwinCore.sceneEvent({
            type:'interaction',
            room:'consultation',
            target:'doctor',
            action:'issue_orders',
            orders:['physical_exam','lab_cbc']
          });
          dlgText.textContent = '已为你开具检查单：体格检查 + 血常规。请前往 Examination/Lab 完成相关检查。';
          renderChoices([{label:'好的', value:'ok'}], ()=>this.close());
        } else {
          this.close();
        }
      });
    } else if (val==='show_triage'){
      dlgText.textContent = '已查看分诊建议，优先安排问诊与必要检查。';
      renderChoices([{label:'明白', value:'ok'}], ()=>this.close());
    } else {
      this.close();
    }
  },
  close(){
    this.active = false;
    this.context = null;
    dlgMask.style.display = 'none';
  }
};
dlgClose.onclick = ()=>Dialogue.close();

function renderChoices(items, onChoose){
  dlgChoices.innerHTML = '';
  items.forEach(({label, value})=>{
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.onclick = ()=>onChoose(value);
    dlgChoices.appendChild(btn);
  });
}

/* ========= 初始化 TwinCore：把当前房间数据交给它 ========= */
TwinCore.init({
  canvas: document.getElementById('game'),
  room: document.body.dataset.room || 'consultation',

  // 资源与主角初始位置（保持你原来的落点与尺寸/速度）
  assets: ASSETS,
  player: { x:502, y:468, w:100, h:100, speed:2.2, frameDelay:100 },

  // 基准坐标与场景数据
  baseSize: { w: BASE_W, h: BASE_H },
  doors: doorBoxesBase,
  obstacles: obstacleBase,
  talks: talkBoxesBase,

  // 顶部 UI 绑定（TwinCore 内部接管 O/G/R 键与显示）
  ui: {
    toast: document.getElementById('toast'),
    coordBtn: document.getElementById('coordBtn'),
    debugBtn: document.getElementById('debugBtn'),
    coordPanel: document.getElementById('coordPanel')
  },

  // UI 协作：当对话框打开时，TwinCore 暂停移动与 E 键交互
  getUiLocked: ()=> Dialogue.active,

  // 按 E 键时的统一回调：由 TwinCore 判定靠近对象并回调你
  onInteract: ({ nearTalk, nearDoor })=>{
    if (nearTalk) {
      Dialogue.open('doctor');           // 走到医生桌前按 E 打开对话
      return;
    }
    if (nearDoor === 'exit') {           // 走到出口按 E 返回大厅
      location.href = RETURN_URL;
    }
  },

  // TwinCore 会在 sceneEvent(...) 后尝试上报（失败不影响前端）
  sceneEventEndpoint: '/api/scene-event',
});
</script>
</body>
</html>
