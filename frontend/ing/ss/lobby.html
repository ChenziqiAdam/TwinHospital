<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hospital Lobby</title>
<style>
  html,body{height:100%;margin:0;background:#1b1b1b;display:grid;place-items:center}
  canvas{image-rendering: pixelated; image-rendering: crisp-edges; background:#000; box-shadow:0 8px 30px rgba(0,0,0,.5); border:2px solid #2b2b2b}
  .hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#cfd8dc;font:14px/1.4 system-ui,Segoe UI,Arial}
  .hint kbd{background:#263238;color:#fff;padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid #0003}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111b;backdrop-filter:blur(6px);
         color:#fff;padding:8px 12px;border-radius:8px;font:13px/1 system-ui,Segoe UI,Arial;display:none}
  .btn{
    position:fixed; top:14px; right:14px; z-index:10;
    background:#1f2937; color:#e5e7eb; border:1px solid #ffffff22; padding:6px 10px; border-radius:8px;
    font:13px system-ui; cursor:pointer; user-select:none; margin-left:8px;
  }
  .btn:hover{ background:#26323f }
  #debugBtn{ right:14px }
  #coordBtn{ right:170px }
  .coord-panel{
    position:fixed; left:14px; top:14px; z-index:10; min-width:220px;
    background:#0b1020d0; color:#e6f1ff; border:1px solid #ffffff22; border-radius:8px;
    padding:8px 10px; font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    backdrop-filter: blur(6px); display:none;
  }
  .coord-panel .tag{color:#9be7ff}
  .coord-panel .small{opacity:.8; font-size:11px}
</style>
</head>
<body>
<canvas id="game" width="1152" height="768"></canvas>
<button class="btn" id="coordBtn">📐 Coords (G)</button>
<button class="btn" id="debugBtn">👀 Show Colliders (O)</button>
<div class="coord-panel" id="coordPanel"></div>
<div class="toast" id="toast">按 <kbd>E</kbd> 进入</div>
<div class="hint">移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键　进入房间：靠近门后按 <kbd>E</kbd>　·　碰撞：<kbd>O</kbd>　·　坐标：<kbd>G</kbd></div>

<script>
/* ---------- Assets ---------- */
const ASSETS = {
  bg: "lobby.png",
  right: ["ACgarRight1.png","ACgarRight2.png","ACgarRight3.png","ACgarRight4.png"],
  left:  ["ACharLeft2.png","ACharLeft3.png","ACharLeft4.png"],
  down:  ["ACharDown1.png","ACharDown2.png"],
  up:    ["ACharUp1.png","ACharUp2.png","ACharUp3.png"]
};
/* ---------- Routes ---------- */
const ROUTES = {
  consult: "consultation.html",
  exam:    "examination.html",
  lab:     "lab.html",
  pharm:   "pharmacy.html"
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* 预载 */
function loadImage(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(new Image()); im.src=src; });}
async function loadAll(){
  const imgs = {};
  imgs.bg = await loadImage(ASSETS.bg);
  for (const d of ['right','left','down','up']) imgs[d] = await Promise.all(ASSETS[d].map(loadImage));
  return imgs;
}

/* ---------- Player ---------- */
const player = {
  x: canvas.width*0.55, y: canvas.height*0.78,
  w: 74, h: 74, speed: 2.2,
  dir: 'down', frame: 0, frameTimer: 0, frameDelay: 100
};
const keys = new Set();

/* ---------- Door & Obstacles (1152x768 基准) ---------- */
const BASE_W = 1152, BASE_H = 768;

const doorBoxesBase = [
  {name:'consult', x: 144, y: 112, w: 120, h: 124},
  {name:'exam',    x: 438, y: 112, w: 92, h: 124},
  {name:'lab',     x: 691, y: 112, w: 80, h: 124},
  {name:'pharm',   x: 923, y: 112, w: 100, h: 124},
];

const obstacleBase = [
  {x: 79,  y: 361, w: 220, h: 90},  // Registration desk
  {x: 771, y: 363, w: 220, h: 90},  // Triage desk
  {x: 380, y: 430, w: 305, h: 36},  // benches row1
  {x: 380, y: 510, w: 305, h: 36},  // benches row2
  {x: 0, y: 0, w: 1151, h: 193},  // wall
  {x: 448, y: 574, w: 185, h: 139},  // benches row2
];

/* ---------- Debug / Coords State ---------- */
const debug = { show: false, alpha: 0.28 };
const coords = { show: false, grid: true, gridSize: 32, mouse: {x:0,y:0}, hover:null };
document.getElementById('debugBtn').onclick = ()=>toggleDebug();
document.getElementById('coordBtn').onclick = ()=>toggleCoords();

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if (k==='o') toggleDebug();
  if (k==='g') toggleCoords();
});

function toggleDebug(){
  debug.show = !debug.show;
  document.getElementById('debugBtn').textContent = (debug.show ? "🙈 Hide Colliders (O)" : "👀 Show Colliders (O)");
}
function toggleCoords(){
  coords.show = !coords.show;
  document.getElementById('coordBtn').textContent = (coords.show ? "🧮 Coords ON (G)" : "📐 Coords (G)");
  document.getElementById('coordPanel').style.display = coords.show ? 'block' : 'none';
}

/* 工具 */
function scaleRect(r){ const sx=canvas.width/BASE_W, sy=canvas.height/BASE_H; return {x:r.x*sx,y:r.y*sy,w:r.w*sx,h:r.h*sy,name:r.name}; }
function baseRectFromScaled(r){ const sx=BASE_W/canvas.width, sy=BASE_H/canvas.height; return {x:Math.round(r.x*sx),y:Math.round(r.y*sy),w:Math.round(r.w*sx),h:Math.round(r.h*sy)}; }
function rectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function pointInRect(px,py,r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }
function toBaseXY(px,py){ // 画布坐标→基准坐标
  const sx=BASE_W/canvas.width, sy=BASE_H/canvas.height;
  return { x: Math.round(px*sx), y: Math.round(py*sy) };
}

/* 鼠标坐标与拾取 */
canvas.addEventListener('mousemove', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  coords.mouse.x = Math.round((e.clientX - rect.left) * sx);
  coords.mouse.y = Math.round((e.clientY - rect.top) * sy);

  // 计算悬停的门/障碍
  coords.hover = null;
  const all = [
    ...doorBoxesBase.map((b,i)=>({ type:'door',  base:b, idx:i, scaled:scaleRect(b) })),
    ...obstacleBase.map((b,i)=>({ type:'obst',  base:b, idx:i, scaled:scaleRect(b) }))
  ].reverse(); // 反向以便后面的覆盖前面的
  for (const it of all){
    if (pointInRect(coords.mouse.x, coords.mouse.y, it.scaled)) { coords.hover = it; break; }
  }
});

/* 点击复制悬停区域的基准坐标 JSON */
canvas.addEventListener('click', async ()=>{
  if (!coords.show || !coords.hover) return;
  const b = coords.hover.base;
  const data = (coords.hover.type==='door')
    ? {name:b.name, x:b.x, y:b.y, w:b.w, h:b.h}
    : {x:b.x, y:b.y, w:b.w, h:b.h};
  const text = JSON.stringify(data);
  try { await navigator.clipboard.writeText(text); flashPanel("已复制到剪贴板: " + text); }
  catch { flashPanel("无法复制，已打印到控制台"); console.log(text); }
});

/* 顶部坐标面板 */
const coordPanel = document.getElementById('coordPanel');
let panelTimer=null;
function flashPanel(msg){
  coordPanel.innerHTML = `<div>${msg}</div>`;
  coordPanel.style.display = 'block';
  clearTimeout(panelTimer);
  panelTimer = setTimeout(()=>{ if(!coords.show) coordPanel.style.display='none'; }, 1600);
}

/* 输入 */
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright','e'].includes(k)) e.preventDefault();
  keys.add(k);
});
addEventListener('keyup', e=>keys.delete(e.key.toLowerCase()));

/* 碰撞 */
function hitsObstacle(rect){
  if (rect.x < 4 || rect.y < 4 || rect.x+rect.w > canvas.width-4 || rect.y+rect.h > canvas.height-4) return true;
  for (const ob of obstacleBase){
    const r = scaleRect(ob);
    if (rectsOverlap(rect, r)) return true;
  }
  return false; // 门口不阻挡
}
function tryMove(dx,dy){
  const next={x:player.x+dx,y:player.y+dy,w:player.w,h:player.h};
  if(!hitsObstacle(next)){player.x+=dx;player.y+=dy;return;}
  const xOnly={x:player.x+dx,y:player.y,w:player.w,h:player.h};
  if(!hitsObstacle(xOnly)) player.x+=dx;
  const yOnly={x:player.x,y:player.y+dy,w:player.w,h:player.h};
  if(!hitsObstacle(yOnly)) player.y+=dy;
}

/* ---------- Loop ---------- */
let imgs, last=0, nearDoor=null;
const toast = document.getElementById('toast');

function update(dt){
  let vx=0, vy=0;
  if (keys.has('w')||keys.has('arrowup'))    { vy -= player.speed; player.dir='up'; }
  if (keys.has('s')||keys.has('arrowdown'))  { vy += player.speed; player.dir='down'; }
  if (keys.has('a')||keys.has('arrowleft'))  { vx -= player.speed; player.dir='left'; }
  if (keys.has('d')||keys.has('arrowright')) { vx += player.speed; player.dir='right'; }
  if (vx&&vy){ vx*=0.7071; vy*=0.7071; }
  tryMove(vx,vy);

  if (vx||vy){
    player.frameTimer += dt;
    const frames = imgs[player.dir];
    if (player.frameTimer > player.frameDelay){ player.frameTimer=0; player.frame=(player.frame+1)%frames.length; }
  } else { player.frame=0; player.frameTimer=0; }

  // 门检测
  const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
  nearDoor = null;
  for(const base of doorBoxesBase){
    const R = scaleRect(base);
    if (rectsOverlap(pRect, R)){ nearDoor = base.name; break; }
  }
  toast.style.display = nearDoor ? 'block' : 'none';
  if (nearDoor && keys.has('e')) {
    const url = ROUTES[nearDoor]; if (url) location.href=url;
  }
}

function draw(){
  ctx.drawImage(imgs.bg, 0, 0, canvas.width, canvas.height);

  // 网格与十字准星
  if (coords.show && coords.grid){
    ctx.save();
    ctx.strokeStyle = "#ffffff18";
    ctx.lineWidth = 1;
    for (let x=0; x<canvas.width; x+=coords.gridSize){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
    }
    for (let y=0; y<canvas.height; y+=coords.gridSize){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
    }
    // 十字准星
    ctx.strokeStyle = "#7dd3fcaa";
    ctx.beginPath(); ctx.moveTo(coords.mouse.x,0); ctx.lineTo(coords.mouse.x,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,coords.mouse.y); ctx.lineTo(canvas.width,coords.mouse.y); ctx.stroke();
    ctx.restore();
  }

  // 玩家
  const frameImg = imgs[player.dir][player.frame] || imgs[player.dir][0];
  ctx.drawImage(frameImg, Math.round(player.x), Math.round(player.y), player.w, player.h);

  // 碰撞/门可视化
  if (debug.show){
    ctx.save();

    // 障碍
    ctx.globalAlpha = debug.alpha;
    ctx.fillStyle = "#00e5ff";
    ctx.strokeStyle = "#00bcd4";
    ctx.lineWidth = 2;
    obstacleBase.forEach((b,i)=>{
      const r = scaleRect(b);
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      // 编号
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#021b1e";
      ctx.fillRect(r.x+4, r.y+4, 22, 16);
      ctx.fillStyle = "#a7ffeb";
      ctx.font = "12px monospace";
      ctx.fillText(String(i), r.x+8, r.y+16);
      ctx.globalAlpha = debug.alpha;
      ctx.fillStyle = "#00e5ff";
    });

    // 门
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#00ff90";
    ctx.lineWidth = 2;
    doorBoxesBase.forEach(b=>{ const r=scaleRect(b); ctx.strokeRect(r.x,r.y,r.w,r.h); });

    // 玩家碰撞盒
    ctx.strokeStyle = "#ffd54f";
    ctx.strokeRect(player.x, player.y, player.w, player.h);

    ctx.restore();
  }

  // 坐标信息面板
  if (coords.show){
    const baseXY = toBaseXY(coords.mouse.x, coords.mouse.y);
    const hover = coords.hover;
    let hoverText = '';
    if (hover){
      const br = hover.base;
      if (hover.type==='door') hoverText = `hover: <span class="tag">door:${br.name}</span>  baseRect: {x:${br.x}, y:${br.y}, w:${br.w}, h:${br.h}}`;
      else hoverText = `hover: <span class="tag">obst#${hover.idx}</span>  baseRect: {x:${br.x}, y:${br.y}, w:${br.w}, h:${br.h}}`;
    }
    coordPanel.innerHTML = `
      <div>mouse canvas: <span class="tag">${coords.mouse.x}, ${coords.mouse.y}</span></div>
      <div>mouse base:   <span class="tag">${baseXY.x}, ${baseXY.y}</span></div>
      <div class="small">${hover ? hoverText : 'hover: —'}</div>
      <div class="small">点击悬停区域可复制其 <b>基准坐标 JSON</b></div>
    `;
    coordPanel.style.display = 'block';
  }
}

function loop(ts){ const dt = ts - last; last = ts; update(dt); draw(); requestAnimationFrame(loop); }
loadAll().then(res=>{ imgs=res; requestAnimationFrame(loop); });
</script>
</body>
</html>
