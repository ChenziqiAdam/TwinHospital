<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pharmacy Room</title>
<style>
  html,body{height:100%;margin:0;background:#111;display:grid;place-items:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:2px solid #2b2b2b;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .btn{position:fixed;top:14px;right:14px;z-index:10;background:#1f2937;color:#e5e7eb;border:1px solid #ffffff22;padding:6px 10px;border-radius:8px;font:13px system-ui;cursor:pointer;margin-left:8px}
  .btn:hover{background:#26323f}
  #coordBtn{right:170px}

  .coord-panel{
    position:fixed;left:14px;top:14px;z-index:10;min-width:220px;
    background:#0b1020d0;color:#e6f1ff;border:1px solid #ffffff22;border-radius:8px;
    padding:8px 10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;backdrop-filter:blur(6px);display:none
  }
  .coord-panel .tag{color:#9be7ff}
  .coord-panel .small{opacity:.8;font-size:11px}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#111b;color:#fff;padding:6px 10px;border-radius:8px;display:none;z-index:20}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#cfd8dc;font:14px system-ui}
  .hint kbd{background:#263238;color:#fff;padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid #0003}

  /* === 对话面板 === */
  .dialogue-mask{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.45);z-index:50}
  .dialogue{
    width:min(560px,92vw);max-height:80vh;overflow:auto;
    background:#0b1020;border:1px solid #2b3b55;border-radius:12px;padding:14px 16px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);color:#e6f1ff;font:14px/1.6 system-ui,Segoe UI,Arial
  }
  .dialogue h3{margin:0 0 8px;font:600 16px system-ui}
  .dialogue .npc{opacity:.92;color:#a3d3ff;margin-bottom:8px}
  .dialogue .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .dialogue .choices button{background:#14213a;color:#e5e7eb;border:1px solid #2b3b55;border-radius:10px;padding:8px 10px;font:13px system-ui;cursor:pointer}
  .dialogue .choices button:hover{background:#172b4d}
  .dialogue .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dialogue .close{background:#1f2937;color:#e5e7eb;border:1px solid #ffffff22;padding:6px 10px;border-radius:8px;font:12px system-ui;cursor:pointer}
</style>
</head>
<body data-room="pharmacy">
<canvas id="game" width="1152" height="768"></canvas>

<!-- 顶部按钮/提示 -->
<button class="btn" id="coordBtn">📐 Coords (G)</button>
<button class="btn" id="debugBtn">👀 Show Colliders (O)</button>
<div class="coord-panel" id="coordPanel"></div>
<div class="toast" id="toast">按 <kbd>E</kbd> 进入</div>
<div class="hint">移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键　对话：靠近窗口按 <kbd>E</kbd>　返回大厅：站在出口按 <kbd>E</kbd>　·　碰撞：<kbd>O</kbd>　·　坐标：<kbd>G</kbd>　·　病历：<kbd>R</kbd></div>

<!-- === 对话 Overlay（TwinCore 会在 UI 占用时暂停移动/交互） === -->
<div class="dialogue-mask" id="dlgMask" role="dialog" aria-modal="true">
  <div class="dialogue" id="dlgBox">
    <div class="row">
      <h3 id="dlgTitle">Pharmacy 窗口</h3>
      <button class="close" id="dlgClose">关闭</button>
    </div>
    <div class="npc" id="dlgText">您好，我是药房护士。请问需要取药还是咨询用法？</div>
    <div class="choices" id="dlgChoices"></div>
  </div>
</div>

<!-- 统一核心模块 -->
<script src="twin-core.js"></script>
<script>
/* ========= 房间专属配置（仅数据与对话逻辑） ========= */

/* 1) 资源与主角帧 */
const ASSETS = {
  bg: "pharmacy.png",
  right: ["ACgarRight1.png","ACgarRight2.png","ACgarRight3.png","ACgarRight4.png"],
  left:  ["ACharLeft2.png","ACharLeft3.png","ACharLeft4.png"],
  down:  ["ACharDown1.png","ACharDown2.png"],
  up:    ["ACharUp1.png","ACharUp2.png","ACharUp3.png"]
};

/* 2) 出口路由（回大厅） */
const RETURN_URL = "lobby.html";

/* 3) 基准坐标 */
const BASE_W = 1152, BASE_H = 768;

/* 4) 出口与障碍（基准坐标） */
const doorBoxesBase = [
  { name: "exit", x: 426, y: 590, w: 250, h: 250 }   // 站在此区域按 E 返回大厅
];

const obstacleBase = [
  {x: 0,   y: 226, w: 1151, h: 200}, // 主柜台（上方）
  {x: 427, y: 599, w: 250, h: 190},  // 中下部前景遮挡
  {x: 705, y: 288, w: 168, h: 255},  // 右侧货柜
];

/* 5) 药房窗口“对话站位带” */
const talkBoxesBase = [
  { name: 'pharmacy_window', x: 383, y: 400, w: 300, h: 49, label: '窗口' }
];

/* 6) 对话系统（与 lobby 同风格） */
const dlgMask = document.getElementById('dlgMask');
const dlgClose = document.getElementById('dlgClose');
const dlgTitle = document.getElementById('dlgTitle');
const dlgText  = document.getElementById('dlgText');
const dlgChoices = document.getElementById('dlgChoices');

const Dialogue = {
  active:false,
  context:null,
  open(kind){
    this.active=true;
    this.context={kind};
    dlgMask.style.display='grid';
    dlgTitle.textContent='Pharmacy 窗口';
    dlgText.textContent='您好，我是药房护士。请问需要取药还是咨询用法？';
    renderChoices([
      {label:'取药（凭处方）', value:'pickup'},
      {label:'咨询用法/用量', value:'consult_usage'},
      {label:'先不需要', value:'cancel'}
    ], (v)=>this.choose(v));
  },
  choose(val){
    // 统一记录到病历，并（可选）上报后端
    TwinCore.sceneEvent({
      type:'interaction',
      room:'pharmacy',
      target:this.context?.kind,
      action:'dialogue_choice',
      choice:val
    });

    if (val==='pickup'){
      dlgText.textContent='请出示电子处方/取药码，我来为您配药结算。';
      renderChoices([
        {label:'出示处方', value:'show_rx'},
        {label:'稍后再来', value:'cancel'}
      ], (v)=>{
        if (v==='show_rx'){
          // 取药完成事件：写入 meds/encounters
          TwinCore.sceneEvent({
            type:'pharmacy',
            room:'pharmacy',
            action:'pickup',
            detail:{ rx:'RX-'+Math.floor(Math.random()*900+100) }
          });
          dlgText.textContent='已完成配药并结算，请按时按量服用。祝您康复！';
          renderChoices([{label:'谢谢', value:'ok'}], ()=>this.close());
        } else {
          this.close();
        }
      });
    } else if (val==='consult_usage'){
      dlgText.textContent='请问您要咨询哪种药物的用法？我可以根据您的处方给出具体建议。';
      renderChoices([{label:'了解了', value:'ok'}], ()=>this.close());
    } else {
      this.close();
    }
  },
  close(){
    this.active=false;
    this.context=null;
    dlgMask.style.display='none';
  }
};
dlgClose.onclick = ()=>Dialogue.close();

function renderChoices(items, onChoose){
  dlgChoices.innerHTML='';
  items.forEach(({label,value})=>{
    const btn=document.createElement('button');
    btn.textContent=label;
    btn.onclick=()=>onChoose(value);
    dlgChoices.appendChild(btn);
  });
}

/* 7) 初始化 TwinCore：把页面专属数据交给它 */
TwinCore.init({
  canvas: document.getElementById('game'),
  room: document.body.dataset.room || 'pharmacy',

  // 资源与主角初始值（放在窗口附近，尺寸与 lobby 保持一致）
  assets: ASSETS,
  player: { x: 502, y: 468, w: 74, h: 74, speed: 2.2, frameDelay: 100 },

  // 基准坐标与场景数据
  baseSize: { w: BASE_W, h: BASE_H },
  doors: doorBoxesBase,
  obstacles: obstacleBase,
  talks: talkBoxesBase,

  // UI 绑定（O/G/R 开关、坐标面板、顶部提示）
  ui: {
    toast: document.getElementById('toast'),
    coordBtn: document.getElementById('coordBtn'),
    debugBtn: document.getElementById('debugBtn'),
    coordPanel: document.getElementById('coordPanel')
  },

  // 对话打开时暂停移动/交互
  getUiLocked: ()=> Dialogue.active,

  // 交互：靠窗口 → 对话；靠出口 → 回大厅
  onInteract: ({ nearTalk, nearDoor })=>{
    if (nearTalk) {
      Dialogue.open('pharmacy_window');
      return;
    }
    if (nearDoor) {
      location.href = RETURN_URL;
    }
  },

  // 可选：TwinCore 先写入病历，再尝试上报
  sceneEventEndpoint: '/api/scene-event',
});
</script>
</body>
</html>
